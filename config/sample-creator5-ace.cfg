# ACE 2 Pro on the RS-485 cable (Kalico ace-pro branch test). Each slot
# feeds its own head: slot 1 -> T0 ... slot 4 -> T3. The heads' stock
# filament switches are the toolhead sensors; they sit about 450 mm before the
# gears.
[AFC_ACE ACE_1]
protocol: ace2
serial: auto
optional: True
autofeed: True
# Switch -> gears is about 450 mm. A feed runs to the switch at full speed,
# then on at stall_speed until the ACE can push no further (the slot reports
# an error: the tip is at the head's still gears), at most 450 x drive_overfeed mm. The
# load then picks the head up at the purge bucket and the extruder takes it
# from the gears. Filament found past the switch with no known position is
# driven through instead: the ACE feeding while the extruder turns, 450 x drive_overfeed
# plus tool_stn.
sensor_to_gears_mm: 450
cold_push: True
stall_detect: True
stall_speed: 25
gear_catch_mm: 175
drive_overfeed: 1.39
sensor_approach_speed: 15
sensor_approach_mm: 50
# After a load: purge in the bucket
purge_cmd: _ACE_PURGE
# No autoload_cmd: autofeed and AFC_ACE_FEED stop at the head's switch, and
# the load (TOOL_LOAD, the UI's load button) takes it into the gears
# Pushed in step with the extruder into the gears; the extruder pulls the
# rest of tool_stn alone with feed assist on
sync_load_mm: 15
# Unloads park the tip this far behind the switch (and feeds cover it slowly)
hub_clear_mm: 200
# then on back into the ACE: dist_hub behind the switch, less unload_leave_mm
unload_to_ace: True
purge_park_cmd: _ACE_PURGE_SPOT

[gcode_macro _ACE_AUTOLOAD]
description: Load an ACE lane into its head, purge, then cool and dock it
gcode:
  # TOOL_LOAD (it homes first), not CHANGE_TOOL: on a Creator 5 that only swaps heads
  TOOL_LOAD LANE={params.LANE}
  _ACE_AUTOLOAD_DOCK

[gcode_macro _ACE_AUTOLOAD_DOCK]
gcode:
  {% set heater = printer.toolhead.extruder %}
  {% set temp = printer[heater].target %}
  {% if temp > 0 %}
    C5_COOL_FOR_DOCK HOTEND={temp}
  {% endif %}
  AFC_UNSELECT_TOOL
  SET_HEATER_TEMPERATURE HEATER={heater} TARGET=0

# C5_TOOL_PURGE needs the head's automatic nozzle Z applied, as print start
# does before it purges
[gcode_macro _ACE_PURGE]
description: Purge the head an ACE lane was just loaded into
gcode:
  {% set tool = printer.creator5_toolchanger.active_tool %}
  {% set heater = printer.toolhead.extruder %}
  C5_AUTO_NOZZLE_Z T={tool} HOTEND={printer[heater].target} BED={printer.heater_bed.target} FIRST_LAYER_HEIGHT=0.2
  C5_TOOL_PURGE

[gcode_macro _ACE_PURGE_SPOT]
description: Where an ACE load extrudes: the purge bucket
gcode:
  C5_MOVE_TO_PURGE_BUCKET

# dist_hub: slot -> the head's switch. A feed runs on until the switch
# whatever it is; AFC_ACE_RETRACT pulls back this much (less 50 mm).
[AFC_lane lane1]
unit: ACE_1:1
extruder: extruder0
hub: direct_load
map: T0
dist_hub: 1000

[AFC_lane lane2]
unit: ACE_1:2
extruder: extruder1
hub: direct_load
map: T1
dist_hub: 1000

[AFC_lane lane3]
unit: ACE_1:3
extruder: extruder2
hub: direct_load
map: T2
dist_hub: 1000

[AFC_lane lane4]
unit: ACE_1:4
extruder: extruder3
hub: direct_load
map: T3
dist_hub: 1000

# Gears -> nozzle on a Creator 5 head (the manual load pushes 80 mm)
[AFC_extruder extruder0]
tool_stn: 70
# Into the hot nozzle (and the ACE in step during the gear catch), mm/s
tool_load_speed: 6
# Out of the head on unload, mm/s
tool_unload_speed: 10

[AFC_extruder extruder1]
tool_stn: 70
# Into the hot nozzle (and the ACE in step during the gear catch), mm/s
tool_load_speed: 6
# Out of the head on unload, mm/s
tool_unload_speed: 10

[AFC_extruder extruder2]
tool_stn: 70
# Into the hot nozzle (and the ACE in step during the gear catch), mm/s
tool_load_speed: 6
# Out of the head on unload, mm/s
tool_unload_speed: 10

[AFC_extruder extruder3]
tool_stn: 70
# Into the hot nozzle (and the ACE in step during the gear catch), mm/s
tool_load_speed: 6
# Out of the head on unload, mm/s
tool_unload_speed: 10

# TOOL_LOAD with TEMP= saves that spool's load temperature first
[gcode_macro TOOL_LOAD]
rename_existing: _AFC_TOOL_LOAD
description: Load a lane into its toolhead. TEMP= sets that spool's load temperature first
gcode:
  {% if params.TEMP is defined and params.LANE is defined %}
    AFC_SET_SPOOL_TEMP LANE={params.LANE} EXTRUDER_TEMP={params.TEMP|int}
  {% endif %}
  _AFC_TOOL_LOAD {rawparams}

# The UIs' lane load button (CHANGE_TOOL LANE=) loads an ACE lane that is not
# in its head yet, when not printing; otherwise it is AFC's head swap
[gcode_macro CHANGE_TOOL]
rename_existing: _AFC_CHANGE_TOOL
description: Load a lane's tool
gcode:
  {% set lane = params.LANE|default('') %}
  {% set obj = printer['AFC_lane ' ~ lane] if lane else None %}
  {% if obj and not obj.tool_loaded and printer.print_stats.state not in ['printing', 'paused'] %}
    _ACE_AUTOLOAD LANE={lane}
  {% else %}
    _AFC_CHANGE_TOOL {rawparams}
  {% endif %}
